info:
  name: get-me
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/api/users/me
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var userId = res.getBody().id
        bru.setVar("userId", userId)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
